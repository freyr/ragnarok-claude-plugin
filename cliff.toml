# git-cliff configuration: https://git-cliff.org/docs/configuration
# Commits are grouped by the release marker in their message: [major], [minor], [patch].

[changelog]
header = """
# Changelog

All notable changes to this project are listed here. Versions follow
[Semantic Versioning](https://semver.org). A release is made when a commit on `main`
holds `[major]`, `[minor]` or `[patch]`.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/freyr/ragnarok-claude-plugin/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | replace(from="[major]", to="") | replace(from="[minor]", to="") | replace(from="[patch]", to="") | replace(from="[none]", to="") | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/freyr/ragnarok-claude-plugin/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "\\[major\\]", group = "<!-- 0 -->Breaking changes" },
  { message = "\\[minor\\]", group = "<!-- 1 -->Features" },
  { message = "\\[patch\\]", group = "<!-- 2 -->Fixes" },
  { message = ".*", group = "<!-- 3 -->Other changes" },
]
